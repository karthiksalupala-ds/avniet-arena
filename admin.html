<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — AVNIET Autonomous Portal</title>
  <meta http-equiv="refresh" content="2; url=index.html">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      text-align: center;
      padding: 20px;

    .error-code {
      font-size: 72px;
      font-weight: 900;
      color: #ef4444;

      margin: 10px 0;
      color: #cbd5e1;

      font-size: 13px;
      color: #64748b;
      max-width: 400px;
      line-height: 1.6;

  <script>
    // Immediate silent bounce back to student portal
    setTimeout(() => {
      window.location.replace("index.html");
    }, 1200);
  </script>
</head>
<body>
  <div class="error-code">404</div>
  <div class="error-title">Page Not Found</div>
  <p class="error-desc">
    The requested administrative path is restricted or does not exist on this institutional server.<br>
    Redirecting to Candidate Examination Portal...

</html>
